<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GroupFund ระบบบริหารเงินกองกลาง (ตัวอย่าง)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f6;--panel:#fff;--ink:#1c2b2a;--muted:#5f7270;--line:#dde5e3;--pri:#0f5c54;--pri-d:#0a463f;--pri-t:#fff;--soft:#e6f1ee;--head:#f6f9f8;--hover:#f9fbfa;--ok:#176b4d;--okbg:#e3f3ec;--warn:#8a5a0b;--warnbg:#fbf0dc;--bad:#a82f2f;--badbg:#fbe9e9;--glass:rgba(255,255,255,.64);--glass2:rgba(255,255,255,.88);--gb:rgba(255,255,255,.8);--sh:0 0 0 1px rgba(15,70,62,.06),0 8px 28px rgba(15,70,62,.10);--bg1:#bfe3dc;--bg2:#d3e1f4;--bg3:#e1efd9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1818;--panel:#152423;--ink:#e4eeed;--muted:#97aeab;--line:#274240;--pri:#4cc9b8;--pri-d:#7fdccf;--pri-t:#062b27;--soft:#173b37;--head:#1a2c2b;--hover:#1a2d2c;--ok:#5fd6a0;--okbg:#14382b;--warn:#f0bf62;--warnbg:#3b2f14;--bad:#f28b8b;--badbg:#401c1c;--glass:rgba(30,52,50,.55);--glass2:rgba(24,40,39,.88);--gb:rgba(255,255,255,.13);--sh:0 0 0 1px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.4);--bg1:#10413d;--bg2:#13294a;--bg3:#173520;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1818;--panel:#152423;--ink:#e4eeed;--muted:#97aeab;--line:#274240;--pri:#4cc9b8;--pri-d:#7fdccf;--pri-t:#062b27;--soft:#173b37;--head:#1a2c2b;--hover:#1a2d2c;--ok:#5fd6a0;--okbg:#14382b;--warn:#f0bf62;--warnbg:#3b2f14;--bad:#f28b8b;--badbg:#401c1c;--glass:rgba(30,52,50,.55);--glass2:rgba(24,40,39,.88);--gb:rgba(255,255,255,.13);--sh:0 0 0 1px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.4);--bg1:#10413d;--bg2:#13294a;--bg3:#173520;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,'Sarabun','Noto Sans Thai',system-ui,sans-serif;background:radial-gradient(60% 50% at 8% 6%,var(--bg1),transparent 70%),radial-gradient(55% 50% at 95% 12%,var(--bg2),transparent 70%),radial-gradient(60% 55% at 70% 100%,var(--bg3),transparent 70%),var(--bg);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:10}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:24px 0;display:flex;flex-direction:column;gap:24px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px}
.mark{width:34px;height:34px;border-radius:4px;background:var(--pri);color:var(--pri-t);display:grid;place-items:center;font-weight:700;font-size:18px}
.bn{font-weight:700;font-size:19px}.bs{font-size:12px;color:var(--muted);line-height:1.2}
.cap{padding:0 20px;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:600}
.nav button{display:flex;align-items:center;width:100%;border:0;border-left:3px solid transparent;background:none;padding:10px 20px 10px 17px;color:var(--muted);text-align:left;font-weight:500}
.nav button:hover{background:var(--hover)}
.nav button.active{background:var(--soft);border-left-color:var(--pri);color:var(--pri);font-weight:600}
.pn{margin-left:auto;background:var(--warnbg);color:var(--warn);border-radius:4px;padding:0 7px;font-size:12px;font-weight:600}
.pn[hidden]{display:none}
.who{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--line);font-size:13px}
.who b{display:block}.who span{color:var(--muted);font-size:12px}
main{min-width:0}
.topbar{height:64px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.crumb{color:var(--muted);font-size:13px}.tt{font-size:17px;font-weight:700;line-height:1.3}
.menu{display:none;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px}
.right{color:var(--muted);font-size:13px;text-align:right}
.mc{padding:28px 32px 40px;max-width:1400px;margin:auto}
.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
h1{font-size:25px;font-weight:700;margin:0 0 4px;line-height:1.4}.welcome p{margin:0;color:var(--muted)}
.btn{border:1px solid transparent;border-radius:6px;padding:8px 16px;font-weight:600;white-space:nowrap}
.btn-primary{background:var(--pri);color:var(--pri-t)}.btn-primary:hover{background:var(--pri-d)}
.btn-outline{background:var(--panel);border-color:var(--line)}.btn-danger{background:var(--panel);color:var(--bad);border-color:var(--bad)}
.btn-sm{padding:3px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat,.panel,.gc{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.stat{padding:16px 18px}.sk{color:var(--muted);font-size:13px}.sv{font-size:25px;font-weight:700;margin:4px 0 2px}.sn{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px;margin-bottom:20px}
.panel{min-width:0;overflow:hidden}.tp{margin-bottom:20px}
.ph{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{font-size:16px;margin:0}.ph p{margin:0;color:var(--muted);font-size:13px}
.pb{padding:18px 20px}
.link{border:0;background:none;color:var(--pri);font-weight:600;padding:4px}
.chart{height:170px;display:flex;gap:12px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 41px,var(--line) 41px,var(--line) 42px)}
.cc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.bp{height:135px;display:flex;align-items:flex-end;gap:4px;justify-content:center;width:100%}
.bar{width:14px;max-width:36%;border-radius:2px 2px 0 0;background:var(--pri)}.bar.e{background:#c9a24e}
.cc small{font-size:12px;color:var(--muted)}
.lg{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--muted)}.lg i{display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--pri)}.lg i.e{background:#c9a24e}
.pi{margin-bottom:18px}.pi:last-child{margin-bottom:0}
.pl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.pl span{color:var(--muted)}
.track{height:8px;background:var(--line);border-radius:2px;overflow:hidden}.fill{height:100%;background:var(--pri)}
.pm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search,select,.field input,.field select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 10px;outline:none}
.search{min-width:200px}.search:focus,select:focus,.field input:focus{border-color:var(--pri)}
.tw{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-size:13px;color:var(--muted);background:var(--head);font-weight:600;padding:10px 20px;white-space:nowrap}
td{padding:11px 20px;border-top:1px solid var(--line);font-size:14px;white-space:nowrap}
tbody tr:hover{background:var(--hover)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tot td{font-weight:700;background:var(--head)}
.sub{display:block;font-size:12px;color:var(--muted);white-space:normal}
.empty{text-align:center;color:var(--muted);padding:24px}
.badge{display:inline-block;padding:1px 9px;border-radius:4px;font-size:12px;font-weight:600}
.paid{color:var(--ok);background:var(--okbg)}.pending{color:var(--warn);background:var(--warnbg)}.rejected{color:var(--bad);background:var(--badbg)}.neutral{color:var(--muted);background:var(--head);border:1px solid var(--line)}
.ra{display:flex;gap:6px}
.gcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gc{padding:18px 20px}.gc h3{margin:0 0 2px;font-size:17px}.gc p{margin:0;color:var(--muted);font-size:13px}
.ga{font-size:24px;font-weight:700;margin-top:14px}
.notice{background:var(--soft);border-radius:6px;padding:12px 16px;font-size:14px;margin-bottom:16px}
.fn{text-align:center;color:var(--muted);font-size:12px;padding:12px}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);width:calc(100% - 32px);max-width:440px;padding:22px}
dialog::backdrop{background:rgba(10,25,23,.45)}
dialog h2{margin:0 0 4px;font-size:19px}dialog>form>p{margin:0 0 14px;color:var(--muted);font-size:14px}
.field{display:grid;gap:4px;margin-bottom:12px}.field label{font-size:14px;font-weight:600}.field input,.field select{width:100%}
.err{color:var(--bad);font-size:14px;min-height:1.2em;margin:4px 0 0}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:6px;font-size:14px}
.toast[hidden]{display:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
@media(max-width:1100px){.app{grid-template-columns:210px minmax(0,1fr)}.mc{padding:22px}.topbar{padding:0 22px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.gcs{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media(max-width:720px){.app{display:block}aside{position:fixed;z-index:15;left:-260px;top:0;bottom:0;width:244px;height:auto;padding-top:calc(24px + env(safe-area-inset-top,0px));transition:left .2s}aside.open{left:0}.menu{display:block}.topbar{padding:0 14px;height:60px}.right{display:none}.mc{padding:18px 14px 32px}.welcome{display:block}.welcome .btn{margin-top:12px;width:100%}.gcs{grid-template-columns:1fr}.search{flex:1;min-width:120px}.ph{padding:14px}.pb{padding:14px}.sv{font-size:21px}}

aside,.topbar,.stat,.gc,.panel,.notice,dialog{background:var(--glass);border:1px solid var(--gb);box-shadow:var(--sh),inset 0 1px 0 var(--gb);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
dialog{background:var(--glass2);border-radius:26px}
dialog::backdrop{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.panel.tp{background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none}
.stat,.gc,.panel,.notice{border-radius:20px}
aside{margin:12px 0 12px 12px;border-radius:24px;height:calc(100vh - 24px);top:calc(env(safe-area-inset-top,0px) + 12px)}
.topbar{margin:12px 16px 0;border-radius:20px;top:calc(env(safe-area-inset-top,0px) + 12px)}
.mc{padding-top:20px}
.mark{border-radius:10px}.cap{padding:0 22px}
.nav{padding:0 10px}
.nav button{border-left:0;border-radius:12px;padding:10px 12px;margin-bottom:2px}
.nav button.active{background:var(--soft);box-shadow:inset 0 0 0 1px var(--gb)}
.btn{border-radius:999px;padding:8px 18px}.btn-sm{padding:3px 12px}
.btn-primary{box-shadow:0 2px 8px rgba(15,92,84,.28)}
.btn-outline,.btn-danger,.menu{background:var(--glass2)}.menu{border-radius:999px}
.badge,.pn{border-radius:999px;padding-left:10px;padding-right:10px}
.search,select,.field input,.field select{border-radius:12px;background:var(--glass2)}.search{border-radius:999px;padding:7px 16px}
.track,.fill{border-radius:999px}.bar{border-radius:6px 6px 0 0}
.toast{background:var(--ink);color:var(--bg);border:0;border-radius:999px;-webkit-backdrop-filter:none;backdrop-filter:none}
@media(max-width:720px){aside{margin:0;height:auto;top:0;border-radius:0 24px 24px 0}.topbar{margin:8px 10px 0;top:calc(env(safe-area-inset-top,0px) + 8px);border-radius:16px}.mc{padding-top:14px}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){aside,.topbar,.stat,.gc,.panel,.notice,dialog{background:var(--panel)}}
@media (prefers-reduced-transparency:reduce){aside,.topbar,.stat,.gc,.panel,.notice,dialog{background:var(--panel);-webkit-backdrop-filter:none;backdrop-filter:none}}

:root{--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fillgrow{from{transform:scaleX(0)}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.92)}}
@keyframes popout{to{opacity:0;transform:translateY(8px) scale(.96)}}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes toastin{from{opacity:0;transform:translateY(14px) scale(.94)}}
#v.anim .welcome,#v.anim .stat,#v.anim .gc,#v.anim .panel,#v.anim .notice{animation:rise .6s var(--ease) backwards;animation-delay:calc(var(--i,0)*60ms)}
#v.anim .bar{transform-origin:bottom;animation:grow .9s var(--ease) backwards;animation-delay:calc(var(--d,0ms) + 250ms)}
#v.anim .bar.e{animation-delay:calc(var(--d,0ms) + 330ms)}
#v.anim .fill{transform-origin:left;animation:fillgrow 1s var(--ease) backwards;animation-delay:.3s}
.btn,.nav button,.menu,.link{transition:transform .25s var(--spring),background-color .2s,box-shadow .25s,color .2s}
.stat,.gc{transition:transform .35s var(--spring),box-shadow .35s}
tbody tr{transition:background-color .15s}
.search,select,.field input,.field select{transition:border-color .2s,box-shadow .2s}
.search:focus,select:focus,.field input:focus{box-shadow:0 0 0 4px rgba(15,92,84,.14)}
@media(hover:hover){.btn:hover{transform:translateY(-1px)}.btn-primary:hover{box-shadow:0 6px 16px rgba(15,92,84,.32)}.stat:hover,.gc:hover{transform:translateY(-3px)}.nav button:hover{transform:translateX(2px)}}
.btn:active,.nav button:active,.menu:active{transform:scale(.95)}
dialog[open]{animation:pop .45s var(--spring) backwards}
dialog[open]::backdrop{animation:fade .3s ease backwards}
dialog[open].closing{animation:popout .2s ease forwards}
dialog[open].closing::backdrop{animation:fadeout .2s ease forwards}
.toast:not([hidden]){animation:toastin .45s var(--spring) backwards}
@media(max-width:720px){aside{transition:left .4s var(--ease)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}

.seg{display:flex;background:var(--head);border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:5px 4px;font-size:13px;color:var(--muted);transition:background-color .25s,color .25s,box-shadow .25s}
.seg button.on{background:var(--panel);color:var(--pri);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.field input[type=file]{padding:6px}

.chart{--dp:8px}
.bp{gap:16px}
.bar{position:relative;width:20px;max-width:34%;border-radius:1px 1px 0 0;background-color:var(--pri);background-image:linear-gradient(90deg,rgba(255,255,255,.24),rgba(255,255,255,0) 55%,rgba(0,0,0,.1));filter:drop-shadow(3px 4px 3px rgba(0,0,0,.18))}
.bar.e{background-color:#c9a24e;background-image:linear-gradient(90deg,rgba(255,255,255,.24),rgba(255,255,255,0) 55%,rgba(0,0,0,.1))}
.bar::before,.bar::after{content:"";position:absolute;background:inherit}
.bar::before{top:0;right:calc(var(--dp)*-1);width:var(--dp);height:100%;transform-origin:left top;transform:skewY(-45deg);filter:brightness(.72)}
.bar::after{left:0;top:calc(var(--dp)*-1);width:100%;height:var(--dp);transform-origin:left bottom;transform:skewX(-45deg);filter:brightness(1.18)}
@media(max-width:720px){.chart{--dp:6px}.bp{gap:12px}.bar{width:12px}}

body{font-family:-apple-system,BlinkMacSystemFont,'Sarabun','Noto Sans Thai',system-ui,sans-serif}
.mono{font-family:inherit;font-size:inherit}
.ic{width:20px;height:20px;flex:none}
.nav button{gap:12px}
dialog{max-height:calc(100vh - 32px);overflow:auto}
@media(pointer:coarse){.btn{min-height:40px}.btn-sm{min-height:36px}.nav button{min-height:46px}.search,select,.field input,.field select{min-height:42px}}
@media(max-width:720px){
input,select{font-size:16px}
table{min-width:0}
table,thead,tbody,tr,td{display:block;width:100%}
thead{position:absolute;left:-9999px}
tbody tr{padding:12px 16px;border-top:1px solid var(--line)}
tbody tr:first-child{border-top:0}
td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:16px;white-space:normal;text-align:right}
td:empty{display:none}
td::before{content:attr(data-label);color:var(--muted);font-size:13px;text-align:left;flex:none}
td:first-child{justify-content:flex-start;text-align:left;font-weight:600}
td:first-child::before,td.empty::before{content:none}
td.empty{display:block;text-align:center;font-weight:400}
.ra{justify-content:flex-end}
}

:root{--bg:#eef4ff;--panel:#fff;--ink:#0f2347;--muted:#566a8f;--line:#d3dff4;--pri:#1f5fd6;--pri-d:#1648b0;--pri-t:#fff;--soft:#e0ebff;--head:#f2f6ff;--hover:#f6f9ff;--glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.9);--gb:rgba(255,255,255,.8);--sh:0 0 0 1px rgba(20,60,150,.07),0 8px 28px rgba(20,60,150,.12);--bg1:#9ec4ff;--bg2:#b4e0ff;--bg3:#c9cdff;--bgA:#eaf2ff;--bgB:#cfe1ff;--grad:linear-gradient(135deg,#2c78e6,#1f5fd6 55%,#1736a6);--gradSoft:linear-gradient(135deg,rgba(78,166,255,.28),rgba(31,95,214,.14));--glA:rgba(255,255,255,.78);--glB:rgba(205,225,255,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1228;--panel:#101c3a;--ink:#e6eeff;--muted:#9db0d6;--line:#243459;--pri:#5aa2ff;--pri-d:#8dbdff;--pri-t:#04122e;--soft:#16305f;--head:#142347;--hover:#16264d;--glass:rgba(22,40,84,.55);--glass2:rgba(16,30,66,.9);--gb:rgba(255,255,255,.13);--sh:0 0 0 1px rgba(0,0,0,.25),0 8px 28px rgba(0,0,0,.45);--bg1:#14367a;--bg2:#0f3f70;--bg3:#232d78;--bgA:#091227;--bgB:#0d2250;--grad:linear-gradient(135deg,#6db4ff,#3a78e8 55%,#2447b8);--gradSoft:linear-gradient(135deg,rgba(109,180,255,.3),rgba(58,120,232,.18));--glA:rgba(28,48,100,.62);--glB:rgba(14,28,66,.55)}}
:root[data-theme="dark"]{--bg:#0a1228;--panel:#101c3a;--ink:#e6eeff;--muted:#9db0d6;--line:#243459;--pri:#5aa2ff;--pri-d:#8dbdff;--pri-t:#04122e;--soft:#16305f;--head:#142347;--hover:#16264d;--glass:rgba(22,40,84,.55);--glass2:rgba(16,30,66,.9);--gb:rgba(255,255,255,.13);--sh:0 0 0 1px rgba(0,0,0,.25),0 8px 28px rgba(0,0,0,.45);--bg1:#14367a;--bg2:#0f3f70;--bg3:#232d78;--bgA:#091227;--bgB:#0d2250;--grad:linear-gradient(135deg,#6db4ff,#3a78e8 55%,#2447b8);--gradSoft:linear-gradient(135deg,rgba(109,180,255,.3),rgba(58,120,232,.18));--glA:rgba(28,48,100,.62);--glB:rgba(14,28,66,.55)}
body{background:radial-gradient(60% 50% at 8% 6%,var(--bg1),transparent 70%),radial-gradient(55% 50% at 95% 12%,var(--bg2),transparent 70%),radial-gradient(60% 55% at 70% 100%,var(--bg3),transparent 70%),linear-gradient(160deg,var(--bgA),var(--bgB));background-attachment:fixed}
aside,.topbar,.stat,.gc,.panel,.notice{background:linear-gradient(160deg,var(--glA),var(--glB))}
.panel.tp{background:var(--panel)}

function vRep(){const rows=G.map(g=>{const ms=M.filter(m=>m.g==g.id),f=x=>x.g==g.id,s=(l)=>ms.filter(m=>l.includes(m.s)).reduce((t,m)=>t+m.amt,0);return{n:g.name,o:sum('open',f),i:sum('income',f),e:sum('expense',f),b:bal(g.id),pd:ms.filter(m=>m.s=='paid').length,t:ms.length,ov:s(['unpaid','rejected']),pe:s(['pending'])}});
 const T=k=>rows.reduce((s,r)=>s+r[k],0),c=v=>`<td class="num">${money(v).slice(2)}</td>`;
 return head('รายงานสรุปฐานะการเงิน','ณ วันที่ '+dt(today))+`<div class="panel tp"><div class="tw"><table><thead><tr><th>กลุ่ม</th><th class="num">ยอดยกมา</th><th class="num">รายรับ</th><th class="num">รายจ่าย</th><th class="num">คงเหลือ</th><th class="num">ชำระแล้ว (รายการ)</th><th class="num">ค้างชำระ</th><th class="num">รอตรวจสอบ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${E(r.n)}</td>${c(r.o)}${c(r.i)}${c(r.e)}${c(r.b)}<td class="num">${r.pd}/${r.t}</td>${c(r.ov)}${c(r.pe)}</tr>`).join('')}<tr class="tot"><td>รวมทุกกลุ่ม</td>${c(T('o'))}${c(T('i'))}${c(T('e'))}${c(T('b'))}<td class="num">${T('pd')}/${T('t')}</td>${c(T('ov'))}${c(T('pe'))}</tr></tbody></table></div></div>${stackChart()}<div class="notice">หมายเหตุ: ยอดคงเหลือคำนวณจากรายการบัญชีที่ยืนยันแล้ว ไม่รวมรายการรอตรวจสอบและรายการที่กลับรายการแล้ว ยอดค้างชำระหมายถึงสมาชิกที่ยังไม่ชำระหรือถูกปฏิเสธหลักฐาน หน่วยเป็นบาท</div>`}

function vMy(){const rs=M.filter(m=>m.code==me),p=PE.find(x=>x.code==me),due=rs.filter(m=>m.s!='paid').reduce((t,m)=>t+m.amt,0);
 const msg=(m,l)=>({unpaid:rq(m.r).due<today?'เกินกำหนดชำระแล้ว กรุณาโอนเงินและส่งหลักฐานโดยเร็ว':'ยังไม่มีการชำระเงิน กรุณาโอนเงินแล้วส่งหลักฐานให้ผู้ดูแลตรวจสอบ',pending:'ส่งหลักฐานแล้ว รอผู้ดูแลตรวจสอบกับบัญชีจริง ยังไม่นับว่าชำระแล้ว',rejected:'หลักฐานถูกปฏิเสธ เหตุผล: '+E(m.reason||'-')+' กรุณาส่งหลักฐานใหม่',paid:'ชำระเงินเรียบร้อยแล้วเมื่อ '+(l?dt(l.date):'')}[m.s]);
 return head('ยอดที่ต้องชำระของฉัน',E(p.name)+' กลุ่ม'+E(gn(p.g)))+`<div class="stats">${stat('ยอดที่ยังไม่ชำระ',money(due),'รวมรายการค้างชำระและรอตรวจสอบ')}${stat('จำนวนรายการ',rs.length+' รายการ','ชำระแล้ว '+rs.filter(m=>m.s=='paid').length+' รายการ')}</div>`+rs.map(m=>`<div class="panel" style="margin-bottom:14px"><div class="pb"><div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:8px"><div><h2 style="margin:0;font-size:16px">${E(rq(m.r).title)}</h2><div class="sn">ครบกำหนด ${dt(rq(m.r).due)}</div></div><div style="text-align:right"><b style="font-size:20px">${money(m.amt)}</b><div>${badge(stx(m))}</div></div></div><p style="margin:0 0 12px">${msg(m,m.h[m.h.length-1])}</p>${m.s=='unpaid'||m.s=='rejected'?`<button class="btn btn-primary" data-a="mysub" data-i="${m.id}">ส่งหลักฐานการชำระ (โอน)</button>`:''}</div></div>`).join('')+`<div class="notice">การส่งหลักฐานไม่ได้หมายความว่าได้รับเงินแล้ว ผู้ดูแลจะตรวจสอบกับรายการเข้าบัญชีจริงก่อนอนุมัติทุกครั้ง</div>`}
function vHist(){const p=PE.find(x=>x.code==me),a=M.filter(m=>m.code==me).flatMap(m=>m.h.map(x=>({...x,m}))).sort((x,y)=>y.date.localeCompare(x.date));
 return head('ประวัติการชำระของฉัน',E(p.name)+' กลุ่ม'+E(gn(p.g)))+`<div class="panel tp"><div class="tw"><table><thead><tr><th>วันที่</th><th>รายการ</th><th>ช่องทาง</th><th class="num">จำนวนเงิน</th><th>สถานะ</th><th>หมายเหตุ</th></tr></thead><tbody>${a.length?a.map(x=>`<tr><td>${dt(x.date)}</td><td>${E(rq(x.m.r).title)}</td><td>${x.how}</td><td class="num">${money(x.m.amt).slice(2)}</td><td>${badge(x.s)}</td><td>${x.reason?'เหตุผล: '+E(x.reason):''}${x.file?'ไฟล์: '+E(x.file):''}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">ยังไม่มีประวัติการชำระ</td></tr>'}</tbody></table></div></div>`}
function mySub(id){const m=M.find(x=>x.id==id);if(!m||m.code!=me)return;dlg('ส่งหลักฐานการชำระ',E(rq(m.r).title)+' ยอด '+money(m.amt)+' ระบบจะจัดเก็บสลิปอย่างปลอดภัยเพื่อให้ผู้ดูแลตรวจสอบ',fld('วันที่โอน',`<input name="d" type="date" value="${today}" max="${today}" required>`)+fld('แนบสลิป (รูปภาพ ไม่เกิน 5 MB)','<input name="s" type="file" accept="image/*" required>'),'ส่งหลักฐาน',f=>{
 if(m.s=='pending'||m.s=='paid')return 'รายการนี้อยู่ระหว่างตรวจสอบหรือชำระแล้ว ไม่สามารถส่งซ้ำได้';
 const s=f.get('s'),d=f.get('d');if(!s||!s.name)return 'กรุณาแนบสลิป';if(!/^image\//.test(s.type))return 'รองรับเฉพาะไฟล์รูปภาพ';if(s.size>5*1024*1024)return 'ไฟล์ใหญ่เกิน 5 MB';
 if(!d||d>today)return 'วันที่โอนไม่ถูกต้อง';
 if(!SB||!AUSER)return 'กรุณาเข้าสู่ระบบก่อน';const path=m.g+'/'+AUSER.id+'/'+Date.now()+'_'+s.name.replace(/[^\w.\-]/g,'_');
 (async()=>{const up=await SB.storage.from('payment-slips').upload(path,s,{contentType:s.type});if(up.error){toast(aTh(up.error.message));return}
  const ins=await SB.from('payments').insert({group_id:m.g,collection_item_id:m.id,user_id:AUSER.id,amount:m.amt,payment_method:'transfer',transfer_date:d,slip_path:path,status:'pending'}).select('id').single();if(ins.error){await SB.storage.from('payment-slips').remove([path]);toast(aTh(ins.error.message));return}
  logA(m.name,'ส่งหลักฐานการชำระ',rq(m.r).title+' '+money(m.amt));await loadFin();render();toast('ส่งหลักฐานแล้ว รอผู้ดูแลตรวจสอบ')})()})}

function countUp(el){const t=el.textContent,m=t.match(/[\d,]+(?:\.\d+)?/);if(!m)return;const q=m[0],v=parseFloat(q.replace(/,/g,'')),d=(q.split('.')[1]||'').length,pre=t.slice(0,m.index),post=t.slice(m.index+q.length),t0=performance.now();

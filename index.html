<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GroupFund ระบบบริหารเงินกองกลาง</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* ---------- 1) Tokens ---------- */
:root{
  /* พื้นผิว */
  --bg:#f3f6f5; --panel:#ffffff; --head:#f4f8f7; --hover:#f7faf9;
  /* ตัวอักษร */
  --ink:#12302c; --muted:#5b7370;
  /* เส้นแบ่ง */
  --line:#dbe5e2; --line-strong:#c3d3cf;
  /* สีหลัก */
  --pri:#087f6e; --pri-d:#066357; --pri-t:#ffffff; --soft:#e8f5f0;
  /* สีตามความหมายทางการเงิน: เขียว=รายรับ/ชำระแล้ว  แดง=รายจ่าย/ปฏิเสธ  เหลือง=รอตรวจ */
  --ok:#17794f;   --okbg:#e2f3ea;
  --warn:#8a5600; --warnbg:#fbefd5;
  --bad:#b42318;  --badbg:#fde8e6;
  /* กระจก (ใช้เฉพาะเมนู แถบบน การ์ดสรุป และป็อปอัป) */
  --glass:rgba(255,255,255,.72); --glass2:rgba(255,255,255,.92); --gb:rgba(255,255,255,.7);
  /* รูปทรง */
  --r-card:16px; --r-ctl:10px; --r-pill:999px;
  --sh:0 1px 2px rgba(18,48,44,.05),0 6px 18px rgba(18,48,44,.06);
  --sh-pop:0 18px 50px rgba(18,48,44,.22);
  /* การเคลื่อนไหว */
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1615; --panel:#112321; --head:#152a28; --hover:#152b29;
    --ink:#e6f1ef; --muted:#93aca8; --line:#23403c; --line-strong:#2f524d;
    --pri:#3fc3ad; --pri-d:#6fd6c4; --pri-t:#04201c; --soft:#14332f;
    --ok:#5fd6a0; --okbg:#12372a; --warn:#f0bf62; --warnbg:#3a2e12; --bad:#ff9a90; --badbg:#41201d;
    --glass:rgba(17,35,33,.72); --glass2:rgba(17,35,33,.94); --gb:rgba(255,255,255,.09);
    --sh:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); --sh-pop:0 18px 50px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1615; --panel:#112321; --head:#152a28; --hover:#152b29;
  --ink:#e6f1ef; --muted:#93aca8; --line:#23403c; --line-strong:#2f524d;
  --pri:#3fc3ad; --pri-d:#6fd6c4; --pri-t:#04201c; --soft:#14332f;
  --ok:#5fd6a0; --okbg:#12372a; --warn:#f0bf62; --warnbg:#3a2e12; --bad:#ff9a90; --badbg:#41201d;
  --glass:rgba(17,35,33,.72); --glass2:rgba(17,35,33,.94); --gb:rgba(255,255,255,.09);
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); --sh-pop:0 18px 50px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ---------- 2) Base ---------- */
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);background:var(--bg);
  font:15px/1.65 'IBM Plex Sans Thai','Sarabun',-apple-system,BlinkMacSystemFont,'Noto Sans Thai',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{line-height:1.35;margin:0}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.mono,.num,.sv,.ga,.dnc b{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}

/* ---------- 3) Layout ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
main{min-width:0}
.mc{padding:28px 36px 48px;max-width:1360px;margin:auto}

/* แถบเมนูข้าง (กระจก) */
aside{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);align-self:start;
  height:calc(100vh - 24px);margin:12px 0 12px 12px;padding:22px 0;
  display:flex;flex-direction:column;gap:22px;
  background:var(--glass);border:1px solid var(--gb);border-radius:22px;box-shadow:var(--sh);
  -webkit-backdrop-filter:saturate(170%) blur(20px);backdrop-filter:saturate(170%) blur(20px);
}
.brand{display:flex;align-items:center;gap:11px;padding:0 20px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--pri);color:var(--pri-t);display:grid;place-items:center;font-weight:700;font-size:18px}
.bn{font-weight:700;font-size:18px;letter-spacing:.01em}
.bs{font-size:12px;color:var(--muted);line-height:1.25}
.brand-copy{display:grid;gap:1px}
.cap{padding:0 22px;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:600}
.nav{position:relative;padding:0 10px}
.nav button{
  position:relative;z-index:1;display:flex;align-items:center;gap:12px;width:100%;
  border:0;border-radius:var(--r-ctl);background:none;padding:10px 12px;margin-bottom:2px;
  color:var(--muted);font-weight:500;text-align:left;transition:color .2s,background-color .2s;
}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button.active{color:var(--pri);font-weight:600;background:transparent}
.nav-hl{position:absolute;left:10px;right:10px;top:0;height:0;opacity:0;border-radius:var(--r-ctl);background:var(--soft);pointer-events:none;transition:transform .38s var(--ease),height .25s,opacity .25s}
.nav-hl::before{content:"";position:absolute;left:0;top:24%;bottom:24%;width:3px;border-radius:3px;background:var(--pri)}
.ic{width:20px;height:20px;flex:none}
.pn{margin-left:auto;background:var(--warnbg);color:var(--warn);border-radius:var(--r-pill);padding:0 8px;font-size:12px;font-weight:600}
.pn[hidden]{display:none}

/* ผู้ใช้ท้ายเมนู */
.who{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--line);font-size:13px}
.who b{display:block}.who span{color:var(--muted);font-size:12px}
.who-profile{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0}
.who-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--soft);display:grid;place-items:center;color:var(--pri);font-weight:700;flex:none}
.who-meta{min-width:0;overflow:hidden}
.who-meta b,.who-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}

/* แถบบน (กระจก) */
.topbar{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:5;
  height:64px;margin:12px 16px 0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:var(--glass);border:1px solid var(--gb);border-radius:18px;box-shadow:var(--sh);
  -webkit-backdrop-filter:saturate(170%) blur(20px);backdrop-filter:saturate(170%) blur(20px);
}
.crumb{color:var(--muted);font-size:13px}.tt{font-size:17px;font-weight:700}
.right{color:var(--muted);font-size:13px;text-align:right}
.menu{display:none;border:1px solid var(--line);background:var(--glass2);border-radius:var(--r-pill);padding:6px 14px}

/* หัวหน้า */
.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.welcome p{margin:4px 0 0;color:var(--muted)}

/* ---------- 4) Buttons ---------- */
.btn{border:1px solid transparent;border-radius:var(--r-pill);padding:9px 20px;font-weight:600;white-space:nowrap;transition:transform .25s var(--ease),background-color .2s,box-shadow .25s,border-color .2s}
.btn-primary{background:var(--pri);color:var(--pri-t)}
.btn-primary:hover{background:var(--pri-d)}
.btn-outline{background:var(--panel);border-color:var(--line-strong)}
.btn-outline:hover{border-color:var(--pri);color:var(--pri)}
.btn-danger{background:var(--panel);color:var(--bad);border-color:var(--bad)}
.btn-danger:hover{background:var(--badbg)}
.btn-sm{padding:4px 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:active:not(:disabled){transform:scale(.97)}
.link{border:0;background:none;color:var(--pri);font-weight:600;padding:4px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.seg{display:flex;background:var(--head);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:var(--r-pill);padding:5px 14px;font-size:13px;color:var(--muted);transition:background-color .25s,color .25s}
.seg button.on{background:var(--panel);color:var(--pri);font-weight:600;box-shadow:0 1px 3px rgba(18,48,44,.14)}

/* ---------- 5) Cards ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat,.panel,.gc,.notice{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card)}
.stat{padding:18px 20px;background:var(--glass);border-color:var(--gb);box-shadow:var(--sh);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.sk{color:var(--muted);font-size:13px}
.sv{font-size:26px;font-weight:700;margin:6px 0 2px;letter-spacing:-.01em}
.sn{font-size:12px;color:var(--muted)}
.panel{min-width:0;overflow:hidden}
.tp{margin-bottom:20px}
.ph{padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.ph h2{font-size:16px}.ph p{margin:0;color:var(--muted);font-size:13px}
.pb{padding:20px 22px}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px;margin-bottom:20px}
.notice{background:var(--soft);border-color:transparent;padding:13px 18px;font-size:14px;margin-bottom:18px}
.divider{height:1px;background:var(--line)}
.fn{text-align:center;color:var(--muted);font-size:12px;padding:14px}

/* การ์ดกลุ่ม */
.gcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.gc{padding:20px 22px;box-shadow:var(--sh)}
.gc h3{font-size:17px;margin:0 0 2px}.gc p{margin:0;color:var(--muted);font-size:13px}
.ga{font-size:26px;font-weight:700;margin-top:16px;letter-spacing:-.01em}

/* ยอดเงิน: เขียว=เข้า แดง=ออก */
.pos{color:var(--ok)}.neg{color:var(--bad)}

/* แถบยอดคงเหลือ (เสริม): ตัวเลขใหญ่ + แถบแบ่งสถานะ */
.balance{padding:22px 24px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--panel);margin-bottom:20px}
.balance .sv{font-size:34px;margin:4px 0 14px}
.bstrip{display:flex;height:10px;border-radius:var(--r-pill);overflow:hidden;background:var(--line);gap:2px}
.bstrip i{display:block;min-width:4px}
.bstrip .s-p{background:var(--ok)}.bstrip .s-w{background:var(--warn)}.bstrip .s-o{background:var(--bad)}

/* ---------- 6) Forms ---------- */
.field{display:grid;gap:5px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600}
.search,select,.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--r-ctl);padding:9px 12px;outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.search{width:auto;min-width:200px;border-radius:var(--r-pill);padding:8px 16px}
select{width:auto}.field select{width:100%}
.search:focus,select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(8,127,110,.15)}
.field input[type=file]{padding:7px}
.field input:disabled,.field select:disabled{background:var(--head);color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-size:14px;min-height:1.3em;margin:4px 0 0}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
#invlink{font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}

/* ---------- 7) Tables (พื้นทึบ อ่านตัวเลขง่าย) ---------- */
.tw{overflow:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;font-size:13px;color:var(--muted);background:var(--head);font-weight:600;padding:11px 16px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-top:1px solid var(--line);font-size:14px;vertical-align:middle}
thead + tbody tr:first-child td{border-top:0}
tbody tr{transition:background-color .15s}
tbody tr:hover{background:var(--hover)}
td.num,th.num,.badge{white-space:nowrap}
.num{text-align:right}
.tot td{font-weight:700;background:var(--head);border-top:1px solid var(--line-strong)}
.sub{display:block;font-size:12px;color:var(--muted);white-space:normal}
.empty{text-align:center;color:var(--muted);padding:28px}
.ra{display:flex;gap:6px;flex-wrap:wrap}

/* ป้ายสถานะ: ใช้ทั้งสีและข้อความเสมอ ไม่พึ่งสีอย่างเดียว */
.badge{display:inline-block;padding:2px 11px;border-radius:var(--r-pill);font-size:12px;font-weight:600;border:1px solid transparent}
.paid{color:var(--ok);background:var(--okbg)}
.pending{color:var(--warn);background:var(--warnbg)}
.rejected{color:var(--bad);background:var(--badbg)}
.neutral{color:var(--muted);background:var(--head);border-color:var(--line)}

/* ---------- 😎 Progress / Charts ---------- */
.pi{margin-bottom:18px}.pi:last-child{margin-bottom:0}
.pl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.pl span{color:var(--muted)}
.track{height:8px;background:var(--line);border-radius:var(--r-pill);overflow:hidden}
.fill{height:100%;background:var(--pri);border-radius:var(--r-pill)}
.pm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}

.chart{--dp:7px;height:176px;display:flex;gap:12px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,var(--line) 43px,var(--line) 44px)}
.chart[hidden],.c3[hidden]{display:none}
.cc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
.bp{height:138px;display:flex;align-items:flex-end;justify-content:center;gap:16px;width:100%}
.cc small{font-size:12px;color:var(--muted)}
.bar{position:relative;width:20px;max-width:34%;background:var(--pri);border-radius:2px 2px 0 0;background-image:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%,rgba(0,0,0,.1))}
.bar.e{background-color:var(--bad)}
.bar::before,.bar::after{content:"";position:absolute;background:inherit}
.bar::before{top:0;right:calc(var(--dp)*-1);width:var(--dp);height:100%;transform-origin:left top;transform:skewY(-45deg);filter:brightness(.72)}
.bar::after{left:0;top:calc(var(--dp)*-1);width:100%;height:var(--dp);transform-origin:left bottom;transform:skewX(-45deg);filter:brightness(1.18)}
.lg{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--muted)}
.lg i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:3px;background:var(--pri)}
.lg i.e{background:var(--bad)}
.lg2{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:14px}
.lg2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}

.c3{position:relative;height:300px;border-bottom:1px solid var(--line)}
.c3 canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.c3bar{position:absolute;left:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
.c3bar button{border:1px solid var(--line-strong);background:var(--glass2);border-radius:var(--r-pill);padding:3px 12px;font-size:12px}
.c3bar button[aria-pressed=true]{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
.c3hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.c3tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:5px 10px;font-size:13px;white-space:nowrap;z-index:3}
.c3tip[hidden]{display:none}

.lc{display:flex;gap:8px;height:190px}
.ly{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--muted);text-align:right;min-width:44px;line-height:1}
.lp{position:relative;flex:1;background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 100%/100% 1px no-repeat}
.lsvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lx{position:relative;height:20px;margin:6px 0 0 52px}
.lx span{position:absolute;transform:translateX(-50%);font-size:12px;color:var(--muted)}
.dot{position:absolute;width:12px;height:12px;transform:translate(-50%,50%);border-radius:50%;background:var(--panel);border:2px solid var(--pri);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.dot:hover,.dot:focus{transform:translate(-50%,50%) scale(1.3);box-shadow:0 0 0 5px rgba(8,127,110,.2);outline:none}
.dot::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--bg);padding:3px 9px;border-radius:7px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.dot:hover::after,.dot:focus::after{opacity:1;transform:translateX(-50%) translateY(0)}
.dot.r::after{left:auto;right:-6px;transform:translateY(4px)}
.dot.r:hover::after,.dot.r:focus::after{transform:none}

.dn{position:relative;width:170px;height:170px;margin:0 auto}
.dn svg{width:100%;height:100%;overflow:visible}
.dseg{transition:stroke-width .2s}.dseg:hover{stroke-width:6}
.dnc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
.dnc b{font-size:26px;line-height:1.2}.dnc span{font-size:12px;color:var(--muted);max-width:100px}
.dl{display:grid;gap:6px;margin-top:16px;font-size:14px}
.dl div{display:flex;align-items:center;gap:8px}.dl i{width:10px;height:10px;border-radius:3px}.dl b{margin-left:auto}
.sbr{margin-bottom:16px}.sbr:last-child{margin-bottom:0}
.sbh{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.sb{display:flex;gap:2px;height:16px;border-radius:var(--r-pill);overflow:hidden;background:var(--line);max-width:100%;margin-bottom:4px}
.sb i{display:block;min-width:3px}
.s-p{background:var(--ok)}.s-w{background:var(--warn)}.s-o{background:var(--bad)}

/* ---------- 9) Dialog / Toast / Auth / Profile ---------- */
dialog{
  width:calc(100% - 32px);max-width:460px;max-height:calc(100vh - 32px);overflow:auto;padding:24px;
  border:1px solid var(--gb);border-radius:22px;color:var(--ink);background:var(--glass2);box-shadow:var(--sh-pop);
  -webkit-backdrop-filter:saturate(170%) blur(22px);backdrop-filter:saturate(170%) blur(22px);
}
dialog::backdrop{background:rgba(8,28,25,.5);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
dialog h2{font-size:19px;margin:0 0 4px}
dialog>form>p{margin:0 0 16px;color:var(--muted);font-size:14px}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:var(--r-pill);font-size:14px;box-shadow:var(--sh-pop)}
.toast[hidden]{display:none}

#auth{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(60% 50% at 10% 0%,var(--soft),transparent 70%),var(--bg)}
#auth[hidden]{display:none}
#auth .panel{width:100%;max-width:400px;box-shadow:var(--sh)}
#auth .auth-brand{padding:18px 22px 4px;gap:10px}
#auth .auth-brand .mark{width:42px;height:42px;border-radius:13px}
#auth form{display:grid;gap:12px}
#auth .btn{width:100%}

function dashRange(period=dashPeriod){

 else{s=new Date(y,m,1);e=now;ps=new Date(y,m-1,1);pe=new Date(y,m,0)}

 return{start:iso(s),end:iso(e),previousStart:iso(ps),previousEnd:iso(pe),label:period=='day'?'วันนี้':period=='year'?'ปีนี้':'เดือนนี้'};
}
function cashFlowSeries(mode=dashFlow){
 const base=new Date(today+'T12:00:00'),period=dashPeriod;
 const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 return [...Array(7)].map((_,i)=>{
  let d,key,label,match;
  if(period=='day'){
   d=new Date(base);d.setDate(base.getDate()-(6-i));key=iso(d);label=d.toLocaleDateString('th-TH',{day:'numeric',month:'short'});
   match=x=>x.date==key;
  }else if(period=='year'){
   d=new Date(base.getFullYear()-(6-i),0,1);key=String(d.getFullYear());label=d.toLocaleDateString('th-TH',{year:'2-digit'});
   match=x=>x.date.slice(0,4)==key;
  }else{
   d=new Date(base.getFullYear(),base.getMonth()-(6-i),1);key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');label=d.toLocaleDateString('th-TH',{month:'short'});
   match=x=>x.date.startsWith(key);
  }
  const inc=sum('income',match),exp=sum('expense',match);
  return{label,value:mode=='in'?inc:mode=='out'?exp:inc-exp};
 });
}

$('#v').addEventListener('change',async e=>{
 if(e.target.id!='profilePhoto')return;

 if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024){toast('กรุณาเลือกรูป JPG, PNG หรือ WebP ขนาดไม่เกิน 10 MB');input.value='';return}
 if(!SB||!AUSER){toast('กรุณาเข้าสู่ระบบก่อน');input.value='';return}
 const trigger=$('#profilePhotoTrigger'),oldPath=AUSER.avatarPath||'';
 if(trigger){trigger.disabled=true;trigger.style.opacity='.6'}
 toast('กำลังอัปโหลดรูปโปรไฟล์...');
 let newPath='';
 try{
  const ext=file.type=='image/png'?'png':file.type=='image/webp'?'webp':'jpg';
  newPath=AUSER.id+'/'+Date.now()+'.'+ext;
  const up=await SB.storage.from('avatars').upload(newPath,file,{contentType:file.type,cacheControl:'3600',upsert:false});
  if(up.error)throw up.error;
  const signed=await SB.storage.from('avatars').createSignedUrl(newPath,3600);
  if(signed.error)throw signed.error;
  const saved=await SB.from('profiles').update({avatar_url:newPath,updated_at:new Date().toISOString()}).eq('id',AUSER.id).select('id').maybeSingle();
  if(saved.error||!saved.data)throw saved.error||new Error('ไม่พบข้อมูลโปรไฟล์ของบัญชีนี้');
  AUSER.avatarPath=newPath;AUSER.avatarUrl=signed.data.signedUrl;
  if(oldPath&&oldPath!=newPath)await SB.storage.from('avatars').remove([oldPath]);
  toast('เปลี่ยนรูปโปรไฟล์เรียบร้อยแล้ว');render();
 }catch(err){
  if(newPath)await SB.storage.from('avatars').remove([newPath]);
  toast(aTh(err.message||err));
 }finally{
  input.value='';
  const b=$('#profilePhotoTrigger');if(b){b.disabled=false;b.style.opacity='1'}
